<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NoodalMath Minimal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Ctext x='6' y='45' font-family='Arial Black, Impact, sans-serif' font-weight='900' font-size='36' letter-spacing='-2'%3E%3Ctspan fill='%2300a8ff'%3EN%3C/tspan%3E%3Ctspan fill='%237cc576'%3Em%3C/tspan%3E%3C/text%3E%3C/svg%3E" type="image/svg+xml"/>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      background-color: #ffffff;
      color: #000000;
      margin: 15px;
      padding: 0;
      text-align: left;
    }
    button.active {
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>VOID PROXY</h1>
  <hr/>

  <p><b>HOST:</b> <span id="s-host">...</span></p>
  <p><b>PROTO:</b> <span id="s-proto">...</span></p>
  <p><b>SW:</b> <span id="s-sw">Checking...</span></p>
  <p><b>UID:</b> <span id="s-uid">...</span></p>
  <p><b>VERSION:</b> v4.1.3</p>

  <hr/>

  <h2>Command Prompt</h2>
  <form id="term-form">
    <p>void@proxy:~$</p>
    <input type="text" id="term-input" placeholder="enter target URL or search query..." required size="60" autocomplete="off" spellcheck="false"/>
    <br/><br/>
    <button type="submit">RUN</button>
  </form>

  <hr/>

  <h2>Proxy Mode</h2>
  <div id="mode-group">
    <button type="button" class="t-btn active" data-v="server">Server Side</button>
    <button type="button" class="t-btn" data-v="scramjet">Scramjet (WISP)</button>
  </div>

  <hr/>

  <h2>Search Engine</h2>
  <div id="engine-group">
    <button type="button" class="t-btn active" data-v="serpapi">SerpApi</button>
    <button type="button" class="t-btn" data-v="serper">Serper</button>
    <button type="button" class="t-btn" data-v="brave">Brave</button>
    <button type="button" class="t-btn" data-v="google">Google</button>
    <button type="button" class="t-btn" data-v="ddg">DuckDuckGo</button>
  </div>

  <hr/>

  <h2>Debug Log</h2>
  <p>
    <button type="button" id="btn-open-settings">Settings (Press Q)</button>
    <button type="button" id="btn-check-update">Check GitHub Update</button>
    <button type="button" id="btn-clear">Clear Log</button>
  </p>

  <pre id="console-out" style="border: 1px solid black; padding: 10px; height: 180px; overflow: auto; background-color: #ffffff; color: #000000;">Initializing Void OS v4.1.3...</pre>

  <!-- Basic Settings Section -->
  <div id="settings-overlay" style="display:none; border: 2px solid black; padding: 15px; margin-top: 15px; background-color: #ffffff;">
    <h2>Settings &amp; System Info</h2>
    <p>User ID: <span id="set-uid">...</span></p>
    <p>Version: v4.1.3</p>
    <p id="set-upd-status">Status: Standby. Check or apply manual update below.</p>
    <p>
      <button type="button" id="btn-manual-check">Check GitHub Update</button>
      <button type="button" id="btn-manual-apply">Apply Instant Update</button>
      <button type="button" id="btn-direct-download">Direct Download void.html</button>
      <button type="button" id="btn-close-settings">Close Settings</button>
    </p>
  </div>

  <script>
    (function() {
      var APP_VER = '4.1.3';
      var GITHUB_REPO = 'wiizzz786/math-quiz';

      var hostEl = document.getElementById('s-host');
      var protoEl = document.getElementById('s-proto');
      var swEl = document.getElementById('s-sw');
      var uidEl = document.getElementById('s-uid');
      var setUidEl = document.getElementById('set-uid');
      var consoleOut = document.getElementById('console-out');
      var form = document.getElementById('term-form');
      var input = document.getElementById('term-input');
      var settingsOverlay = document.getElementById('settings-overlay');
      var updStatusEl = document.getElementById('set-upd-status');
      var manualCheckBtn = document.getElementById('btn-manual-check');
      var manualApplyBtn = document.getElementById('btn-manual-apply');
      var directDownloadBtn = document.getElementById('btn-direct-download');

      var mode = 'server';
      var engine = 'serpapi';

      var isVercel = window.location.hostname.includes('vercel.app') || window.location.hostname.includes('now.sh');
      hostEl.textContent = isVercel ? 'vercel.app' : (window.location.hostname || 'localhost');
      protoEl.textContent = window.location.protocol.replace(':', '').toUpperCase();

      /* User ID Generator & Storage */
      function getUID() {
        var id = localStorage.getItem('void_uid');
        if (!id) {
          var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
          id = 'UID-';
          for (var i = 0; i < 8; i++) {
            if (i === 4) id += '-';
            id += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          localStorage.setItem('void_uid', id);
        }
        return id;
      }
      var uid = getUID();
      uidEl.textContent = uid;
      setUidEl.textContent = uid;

      function log(msg) {
        var t = new Date().toISOString().split('T')[1].slice(0, 8);
        consoleOut.textContent += '\n[' + t + '] ' + msg;
        consoleOut.scrollTop = consoleOut.scrollHeight;
      }

      if ('serviceWorker' in navigator) {
        swEl.textContent = 'ONLINE';
      } else {
        swEl.textContent = 'OFFLINE';
      }

      function toggleSettings() {
        var isShown = (settingsOverlay.style.display === 'none' || !settingsOverlay.style.display);
        settingsOverlay.style.display = isShown ? 'block' : 'none';
        if (isShown) {
          log('Opened Settings menu (Q).');
          checkGitHubUpdate();
        }
      }

      document.getElementById('btn-open-settings').addEventListener('click', toggleSettings);
      document.getElementById('btn-close-settings').addEventListener('click', function() {
        settingsOverlay.style.display = 'none';
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'q' || e.key === 'Q') {
          var ae = document.activeElement;
          if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
          e.preventDefault();
          toggleSettings();
        }
        if (e.key === 'Escape' && settingsOverlay.style.display === 'block') {
          settingsOverlay.style.display = 'none';
        }
      });

      function parseVer(v) {
        return (v || '').replace(/^v/, '').split('.').map(function(n) { return parseInt(n, 10) || 0; });
      }
      function isNewerVer(remote, local) {
        var r = parseVer(remote);
        var l = parseVer(local);
        for (var i = 0; i < Math.max(r.length, l.length); i++) {
          var rv = r[i] || 0;
          var lv = l[i] || 0;
          if (rv > lv) return true;
          if (rv < lv) return false;
        }
        return false;
      }

      function checkGitHubUpdate() {
        log('Checking GitHub for updates (' + GITHUB_REPO + ')...');
        updStatusEl.textContent = 'Status: Checking GitHub repo...';
        fetch('https://raw.githubusercontent.com/' + GITHUB_REPO + '/main/package.json?t=' + Date.now())
          .then(function(res) { return res.ok ? res.json() : null; })
          .then(function(pkg) {
            if (!pkg || !pkg.version) {
              updStatusEl.textContent = 'Status: Unable to fetch GitHub release info.';
              log('Update check failed.');
              return;
            }
            log('GitHub Remote Version: v' + pkg.version + ' (Local: v' + APP_VER + ')');
            if (isNewerVer(pkg.version, APP_VER)) {
              updStatusEl.textContent = '[UPDATE AVAILABLE: v' + pkg.version + '] Press Apply Instant Update or Download!';
              log('>>> NEW UPDATE FOUND: v' + pkg.version + ' <<<');
            } else {
              updStatusEl.textContent = 'System is fully up to date (v' + APP_VER + ').';
              log('System up to date (v' + APP_VER + ').');
            }
          })
          .catch(function(err) {
            updStatusEl.textContent = 'Status: Update check failed (' + err.message + ')';
            log('Update check error: ' + err.message);
          });
      }

      function applyManualUpdate() {
        log('[MANUAL UPDATE]: Fetching raw void.html from GitHub main branch...');
        updStatusEl.textContent = '[UPDATE IN PROGRESS]: Fetching latest code from GitHub...';
        var rawUrl = 'https://raw.githubusercontent.com/' + GITHUB_REPO + '/main/void.html?t=' + Date.now();
        fetch(rawUrl)
          .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(function(html) {
            log('[MANUAL UPDATE SUCCESS]: Received fresh void.html (' + html.length + ' bytes).');
            updStatusEl.textContent = '[UPDATE APPLIED]: Reloading client...';
            try {
              document.open();
              document.write(html);
              document.close();
              log('[MANUAL UPDATE COMPLETE]: Client updated and reloaded with latest code!');
            } catch(e) {
              window.location.reload(true);
            }
          })
          .catch(function(err) {
            log('[MANUAL UPDATE ERROR]: Failed to fetch raw update (' + err.message + ').');
            updStatusEl.textContent = '[UPDATE FAILED]: ' + err.message;
          });
      }

      function directDownloadFile() {
        log('[DIRECT DOWNLOAD]: Fetching latest void.html code from GitHub for file download...');
        updStatusEl.textContent = '[DOWNLOAD]: Preparing void.html download file...';
        var rawUrl = 'https://raw.githubusercontent.com/' + GITHUB_REPO + '/main/void.html?t=' + Date.now();
        fetch(rawUrl)
          .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(function(html) {
            var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'void.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            log('[DIRECT DOWNLOAD SUCCESS]: void.html file downloaded directly to your device!');
            updStatusEl.textContent = '[DOWNLOAD COMPLETE]: void.html saved to device!';
          })
          .catch(function(err) {
            log('[DIRECT DOWNLOAD ERROR]: ' + err.message);
            updStatusEl.textContent = '[DOWNLOAD FAILED]: ' + err.message;
          });
      }

      if (manualCheckBtn) manualCheckBtn.addEventListener('click', checkGitHubUpdate);
      if (manualApplyBtn) manualApplyBtn.addEventListener('click', applyManualUpdate);
      if (directDownloadBtn) directDownloadBtn.addEventListener('click', directDownloadFile);
      document.getElementById('btn-check-update').addEventListener('click', checkGitHubUpdate);

      (function bootSequence() {
        log('User Authenticated: ' + uid);
        log('Mounting VFS and Proxy Modules...');
        log('SW Status: ONLINE | Mode: ' + mode + ' | Engine: ' + engine);
        setTimeout(checkGitHubUpdate, 400);
      })();

      function bindGroup(id, onSelect) {
        var el = document.getElementById(id);
        el.addEventListener('click', function(e) {
          var btn = e.target.closest('.t-btn');
          if (!btn) return;
          el.querySelectorAll('.t-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          onSelect(btn.dataset.v);
        });
      }

      bindGroup('mode-group', function(val) {
        mode = val;
        log('Option set: --mode=' + val);
      });

      bindGroup('engine-group', function(val) {
        engine = val;
        log('Option set: --engine=' + val);
      });

      document.getElementById('btn-clear').addEventListener('click', function() {
        consoleOut.textContent = 'Console reset.';
      });

      var DOMAIN_SHORTCUTS = {
        'google': 'https://www.google.com',
        'youtube': 'https://www.youtube.com',
        'discord': 'https://discord.com',
        'reddit': 'https://reddit.com',
        'github': 'https://github.com',
        'twitter': 'https://twitter.com',
        'x': 'https://x.com',
        'instagram': 'https://instagram.com',
        'tiktok': 'https://tiktok.com',
        'wikipedia': 'https://wikipedia.org',
        'spotify': 'https://spotify.com'
      };

      var ENGINES = {
        serpapi: function(q) { return '/serpapi-results?q=' + encodeURIComponent(q); },
        serper: function(q) { return '/serper-results?q=' + encodeURIComponent(q); },
        brave: function(q) { return 'https://search.brave.com/search?q=' + encodeURIComponent(q); },
        google: function(q) { return 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(q); },
        ddg: function(q) { return 'https://duckduckgo.com/?q=' + encodeURIComponent(q); }
      };

      function resolveQuery(raw) {
        var val = raw.trim();
        if (!val) return null;
        if (/^https?:\/\//i.test(val)) return val;
        var low = val.toLowerCase();
        if (DOMAIN_SHORTCUTS[low]) return DOMAIN_SHORTCUTS[low];
        if (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(val) && !val.includes(' ')) return 'https://' + val;
        var searchFn = ENGINES[engine] || ENGINES.google;
        return searchFn(val);
      }

      function getOriginBase() {
        if (typeof window !== 'undefined' && window.location && /^https?:$/i.test(window.location.protocol)) {
          return window.location.origin;
        }
        return 'https://math-quiz-alpha-gilt.vercel.app';
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var target = resolveQuery(input.value);
        if (!target) return;

        var base = getOriginBase();
        log('Target resolved -> ' + target);

        if (target.startsWith('/serpapi-results') || target.startsWith('/serper-results')) {
          var destSearch = base + target;
          log('Executing API Search View: ' + destSearch);
          window.location.href = destSearch;
          return;
        }

        if (mode === 'scramjet') {
          log('Spawning Scramjet ServiceWorker thread...');
          if ('serviceWorker' in navigator) {
            try {
              var reg = await navigator.serviceWorker.register('/scramjet/scramjet.worker.js', { scope: '/scramjet/service/' });
              log('Scramjet SW Scope: ' + reg.scope);
            } catch (err) {
              log('Scramjet SW Error: ' + err.message);
            }
          }
          var encoded = btoa(target).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
          var dest = base + '/scramjet/service/' + encoded;
          log('Navigating -> ' + dest);
          window.location.href = dest;
        } else {
          var destServer = base + '/go?url=' + encodeURIComponent(target) + '&mode=server';
          log('Navigating -> ' + destServer);
          window.location.href = destServer;
        }
      });
    })();
  </script>
</body>
</html>
