<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NoodalMath</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Ctext x='6' y='45' font-family='Arial Black, Impact, sans-serif' font-weight='900' font-size='36' letter-spacing='-2'%3E%3Ctspan fill='%2300a8ff'%3EN%3C/tspan%3E%3Ctspan fill='%237cc576'%3Em%3C/tspan%3E%3C/text%3E%3C/svg%3E" type="image/svg+xml"/>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      background-color: #ffffff;
      color: #000000;
      margin: 15px;
      padding: 0;
      text-align: left;
    }
    button.active {
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>VOID PROXY</h1>
  <hr/>

  <h2>Search Bar</h2>
  <form id="term-form">
    <input type="text" id="term-input" placeholder="enter target URL or search query..." required size="60" autocomplete="off" spellcheck="false"/>
    <br/><br/>
    <button type="submit">RUN</button>
  </form>

  <hr/>

  <h2>Proxy Mode</h2>
  <div id="mode-group">
    <button type="button" class="t-btn active" data-v="server">Server Side</button>
  </div>

  <hr/>

  <h2>Search Engine</h2>
  <div id="engine-group">
    <button type="button" class="t-btn active" data-v="serpapi">SerpApi</button>
    <button type="button" class="t-btn" data-v="serper">Serper</button>
    <button type="button" class="t-btn" data-v="brave">Brave</button>
    <button type="button" class="t-btn" data-v="google">Google</button>
    <button type="button" class="t-btn" data-v="ddg">DuckDuckGo</button>
  </div>

  <script>
    (function() {
      var form = document.getElementById('term-form');
      var input = document.getElementById('term-input');

      var mode = 'server';
      var engine = 'serpapi';

      function bindGroup(id, onSelect) {
        var el = document.getElementById(id);
        el.addEventListener('click', function(e) {
          var btn = e.target.closest('.t-btn');
          if (!btn) return;
          el.querySelectorAll('.t-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          onSelect(btn.dataset.v);
        });
      }

      bindGroup('mode-group', function(val) { mode = val; });
      bindGroup('engine-group', function(val) { engine = val; });

      var DOMAIN_SHORTCUTS = {
        'google': 'https://www.google.com',
        'youtube': 'https://www.youtube.com',
        'discord': 'https://discord.com',
        'reddit': 'https://reddit.com',
        'github': 'https://github.com',
        'twitter': 'https://twitter.com',
        'x': 'https://x.com',
        'instagram': 'https://instagram.com',
        'tiktok': 'https://tiktok.com',
        'wikipedia': 'https://wikipedia.org',
        'spotify': 'https://spotify.com'
      };

      var ENGINES = {
        serpapi: function(q) { return '/serpapi-results?q=' + encodeURIComponent(q); },
        serper: function(q) { return '/serper-results?q=' + encodeURIComponent(q); },
        brave: function(q) { return 'https://search.brave.com/search?q=' + encodeURIComponent(q); },
        google: function(q) { return 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(q); },
        ddg: function(q) { return 'https://duckduckgo.com/?q=' + encodeURIComponent(q); }
      };

      function resolveQuery(raw) {
        var val = raw.trim();
        if (!val) return null;
        if (/^https?:\/\//i.test(val)) return val;
        var low = val.toLowerCase();
        if (DOMAIN_SHORTCUTS[low]) return DOMAIN_SHORTCUTS[low];
        if (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(val) && !val.includes(' ')) return 'https://' + val;
        var searchFn = ENGINES[engine] || ENGINES.google;
        return searchFn(val);
      }

      function getOriginBase() {
        if (typeof window !== 'undefined' && window.location && /^https?:$/i.test(window.location.protocol)) {
          return window.location.origin;
        }
        return 'https://math-quiz-alpha-gilt.vercel.app';
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var target = resolveQuery(input.value);
        if (!target) return;

        var base = getOriginBase();

        if (target.startsWith('/serpapi-results') || target.startsWith('/serper-results')) {
          window.location.href = base + target;
          return;
        }

        window.location.href = base + '/go?url=' + encodeURIComponent(target) + '&mode=server';
      });
    })();
  </script>
</body>
</html>
