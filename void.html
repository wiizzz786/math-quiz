<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NoodalMath</title>
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
    }
  </style>
</head>
<body>
  <h1>VOID</h1>
  
  <div style="display:none;">
    <p>HOST: <span id="s-host">...</span></p>
    <p>PROTO: <span id="s-proto">...</span></p>
    <p>MODE: <span id="disp-mode">Mega</span></p>
    <p>UID: <span id="s-uid">...</span></p>
  </div>

  <h2>Search</h2>
  <form id="term-form">
    <input type="text" id="term-input" placeholder="search the web or enter target URL..." required autocomplete="off" spellcheck="false" size="50"/>
    <button type="submit">SEARCH</button>
    <div id="autocomplete-box" style="display:none;"></div>
  </form>

  <h2>Mode</h2>
  <div id="mode-group">
    <button type="button" class="t-btn active" data-v="megasilly">Mega</button>
    <button type="button" class="t-btn" data-v="google">Google</button>
  </div>

  <div id="media-container" style="display:none;"></div>

  <div>
    <h2>Console</h2>
    <pre id="console-out" style="border:1px solid #000; padding:10px; height:100px; overflow:auto;">Starting...</pre>
    

    <div style="display:none;">
      <button type="button" id="btn-open-settings">Settings</button>
      <button type="button" id="btn-clear">Clear Console</button>
    </div>
  </div>

  <div id="settings-overlay" style="display:none; border:1px solid #000; padding:10px; margin-top:10px;">
    <h2>Settings & System Info</h2>
    <p>User ID: <span id="set-uid">...</span></p>
    <p>Current Mode: <span id="set-mode-lbl">Mega</span></p>
    <p id="set-upd-status">Status: Standby.</p>
    <p>Fake TLD: <input type="text" id="set-tld" value=".www.securly.com" size="15"/></p>
    <button type="button" id="btn-save-tld">Save</button>
    <button type="button" id="btn-manual-check">Check GitHub Update</button>
    <button type="button" id="btn-close-settings">Close</button>
  </div>

  <div id="feature-section" style="display:none;"></div>

  <script>
    (function() {
      var APP_VER = '4.5.5';
      var GITHUB_REPO = 'wiizzz786/math-quiz';

      var hostEl = document.getElementById('s-host');
      var protoEl = document.getElementById('s-proto');
      var uidEl = document.getElementById('s-uid');
      var setUidEl = document.getElementById('set-uid');
      var dispMode = document.getElementById('disp-mode');
      var setModeLbl = document.getElementById('set-mode-lbl');
      var featureSection = document.getElementById('feature-section');
      var consoleOut = document.getElementById('console-out');
      var form = document.getElementById('term-form');
      var input = document.getElementById('term-input');
      var acBox = document.getElementById('autocomplete-box');
      var mediaContainer = document.getElementById('media-container');
      var settingsOverlay = document.getElementById('settings-overlay');
      var updStatusEl = document.getElementById('set-upd-status');
      var manualCheckBtn = document.getElementById('btn-manual-check');
      var manualApplyBtn = document.getElementById('btn-manual-apply');
      var directDownloadBtn = document.getElementById('btn-direct-download');
      var tldInput = document.getElementById('set-tld');
      var saveTldBtn = document.getElementById('btn-save-tld');
      var customTld = localStorage.getItem('void_tld') || '.www.securly.com';
      if(tldInput) tldInput.value = customTld;
      if(saveTldBtn) saveTldBtn.addEventListener('click', function() { var v = tldInput.value.trim(); if(!v.startsWith('.')) v = '.' + v; customTld = v; localStorage.setItem('void_tld', v); log('Custom TLD updated to ' + v); if('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js?tld=' + encodeURIComponent(v)); } });

      var currentMode = 'megasilly'; 
      var activeFeature = 'web';     

      var isVercel = window.location.hostname.includes('vercel.app') || window.location.hostname.includes('now.sh');
      hostEl.textContent = isVercel ? 'vercel.app' : (window.location.hostname || 'localhost');
      protoEl.textContent = window.location.protocol.replace(':', '').toUpperCase();

      function getUID() {
        var id = localStorage.getItem('void_uid');
        if (!id) {
          var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
          id = 'UID-';
          for (var i = 0; i < 8; i++) {
            if (i === 4) id += '-';
            id += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          localStorage.setItem('void_uid', id);
        }
        return id;
      }
      var uid = getUID();
      uidEl.textContent = uid;
      setUidEl.textContent = uid;

      function log(msg) {
        var t = new Date().toISOString().split('T')[1].slice(0, 8);
        consoleOut.textContent += '\n[' + t + '] ' + msg;
        consoleOut.scrollTop = consoleOut.scrollHeight;
      }

      function toggleSettings() {
        var isShown = (settingsOverlay.style.display === 'block');
        settingsOverlay.style.display = isShown ? 'none' : 'block';
        if (!isShown) {
          log('Opened Settings menu.');
          checkGitHubUpdate();
        }
      }

      document.getElementById('btn-open-settings').addEventListener('click', toggleSettings);
      document.getElementById('btn-close-settings').addEventListener('click', function() {
        settingsOverlay.style.display = 'none';
      });

      function parseVer(v) {
        return (v || '').replace(/^v/i, '').trim().split('.').map(function(n) { return parseInt(n, 10) || 0; });
      }
      function isNewerVer(remote, local) {
        if (!remote || !local) return false;
        var rStr = (remote || '').replace(/^v/i, '').trim();
        var lStr = (local || '').replace(/^v/i, '').trim();
        if (rStr === lStr) return false;
        var r = parseVer(remote);
        var l = parseVer(local);
        for (var i = 0; i < Math.max(r.length, l.length); i++) {
          var rv = r[i] || 0;
          var lv = l[i] || 0;
          if (rv > lv) return true;
          if (rv < lv) return false;
        }
        return false;
      }

      function pollForUpdates() {
        fetch('/api/version')
          .then(function(res) { return res.ok ? res.json() : null; })
          .then(function(pkg) {
            if (pkg && pkg.version && isNewerVer(pkg.version, APP_VER)) {
              log('[AUTO-UPDATER]: New version detected (v' + pkg.version + '). Reloading seamlessly...');
              updStatusEl.textContent = '[UPDATE]: Reloading client to v' + pkg.version + '...';
              setTimeout(function() {
                window.location.href = window.location.pathname + '?v=' + pkg.version;
              }, 1000);
            }
          })
          .catch(function(err) {
            log('[AUTO-UPDATER]: Background check failed: ' + err.message);
          });
      }

      // Check immediately on load, then every 5 minutes
      pollForUpdates();
      setInterval(pollForUpdates, 5 * 60 * 1000);

      var acTimer = null;
      input.addEventListener('input', function() {
        clearTimeout(acTimer);
        var q = input.value.trim();
        if (!q || q.length < 2 || /^https?:\/\//i.test(q)) {
          acBox.style.display = 'none';
          return;
        }
        acTimer = setTimeout(function() {
          fetch('/api/autocomplete?q=' + encodeURIComponent(q))
            .then(function(r) { return r.json(); })
            .then(function(data) {
              var list = data.suggestions || [];
              if (!list.length) {
                acBox.style.display = 'none';
                return;
              }
              acBox.innerHTML = list.slice(0, 6).map(function(s) {
                return '<span class="ac-pill" data-val="' + s.replace(/"/g, '&quot;') + '" style="cursor:pointer; margin-right:5px; border:1px solid #ccc; padding:2px;">' + s + '</span>';
              }).join('');
              acBox.style.display = 'block';
            })
            .catch(function() { acBox.style.display = 'none'; });
        }, 200);
      });

      acBox.addEventListener('click', function(e) {
        var pill = e.target.closest('.ac-pill');
        if (!pill) return;
        input.value = pill.dataset.val;
        acBox.style.display = 'none';
        form.dispatchEvent(new Event('submit'));
      });

      (function bootSequence() {
      if ("serviceWorker" in navigator) {
        var swTld = localStorage.getItem("void_tld") || ".www.securly.com";
        navigator.serviceWorker.register("/sw.js?tld=" + encodeURIComponent(swTld))
          .then(function(reg) { log("Service Worker registered (Scope: " + reg.scope + ")"); })
          .catch(function(err) { log("Service Worker failed: " + err); });
      }
  
        setTimeout(checkGitHubUpdate, 400);
      })();

      function bindGroup(id, onSelect) {
        var el = document.getElementById(id);
        el.addEventListener('click', function(e) {
          var btn = e.target.closest('.t-btn');
          if (!btn) return;
          el.querySelectorAll('.t-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          onSelect(btn.dataset.v);
        });
      }

      bindGroup('mode-group', function(val) {
        currentMode = val;
        dispMode.textContent = val === 'megasilly' ? 'Mega' : 'Google';
        setModeLbl.textContent = val === 'megasilly' ? 'Mega' : 'Google';
        if (featureSection) featureSection.style.display = val === 'megasilly' ? 'block' : 'none';
        mediaContainer.style.display = 'none';
        log('Active Mode set to: ' + (val === 'megasilly' ? 'Mega' : 'Google'));
      });

      document.getElementById('btn-clear').addEventListener('click', function() {
        consoleOut.textContent = 'Console reset.';
      });
      function encryptUrl(str) {
        if (!str) return '';
        var salt = Math.random().toString(36).substring(2, 6);
        while(salt.length<4) salt+="x";
        var u = salt + "||" + str;
        var key = "Void2026";
        var out = [];
        for (var i = 0; i < u.length; i++) {
          var code = u.charCodeAt(i) ^ key.charCodeAt(i % key.length);
          out.push(String.fromCharCode(code));
        }
        var tld = localStorage.getItem("void_tld") || ".www.securly.com";
        return btoa(out.join('')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '') + tld;
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var rawVal = input.value.trim();
        if (!rawVal) return;
        acBox.style.display = 'none';

        var targetUrl = '';
        var isDirectUrl = /^https?:\/\//i.test(rawVal) || (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(rawVal) && !rawVal.includes(' '));
        if (isDirectUrl) {
          var target = /^https?:\/\//i.test(rawVal) ? rawVal : ('https://' + rawVal);
          log('Opening direct URL via Void Proxy: ' + target);
          var encryptedTarget = encryptUrl(target);
          targetUrl = '/v?q=' + encodeURIComponent(encryptedTarget) + '&mode=server';
        } else if (currentMode === 'google') {
          log('Executing Google Mode Search (No API) for: "' + rawVal + '"...');
          var googleSearchUrl = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(rawVal);
          var encryptedVal = encryptUrl(googleSearchUrl);
          targetUrl = '/v?q=' + encodeURIComponent(encryptedVal) + '&mode=server';
        } else {
          log('Executing Mega Search (Randomized SerpApi + Serper) for: "' + rawVal + '"...');
          var encryptedVal = encryptUrl(rawVal);
          targetUrl = '/s?q=' + encodeURIComponent(encryptedVal);
        }

        var win = window.open('about:blank', '_blank');
        if (win) {
          win.document.title = 'Classes';
          win.document.body.style.margin = '0';
          win.document.body.style.height = '100vh';
          win.document.body.style.overflow = 'hidden';
          var iframe = win.document.createElement('iframe');
          iframe.style.border = 'none';
          iframe.style.width = '100vw';
          iframe.style.height = '100vh';
          iframe.style.margin = '0';
          iframe.src = window.location.origin + targetUrl;
          win.document.body.appendChild(iframe);
        } else {
          window.location.href = targetUrl;
        }
      });
    })();
  </script>
</body>
</html>
