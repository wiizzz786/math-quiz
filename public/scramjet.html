<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scramjet — Void</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b7aff'/%3E%3Cstop offset='50%25' stop-color='%23a78bfa'/%3E%3Cstop offset='100%25' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M32 4L8 52h12L32 24l12 28h12L32 4z'/%3E%3C/svg%3E" type="image/svg+xml" />
  <link rel="stylesheet" href="/proxy-shell.css" />
  <script src="/scram/scramjet.all.js"></script>
</head>
<body class="proxy-shell-page proxy-shell-page--sj">
  <div class="proxy-shell">
    <div class="proxy-shell-inner">
      <p class="proxy-shell-kicker">Scramjet</p>
      <h1 class="proxy-shell-title">Starting up</h1>
      <p class="proxy-shell-phase" id="status">Initializing Scramjet…</p>
      <div class="proxy-shell-bar" id="boot-bar">
        <div class="proxy-shell-bar-fill"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/scramjet-boot.mjs"></script>
  <script>
    // Hide the loading bar once boot is done (status text changes away from initializing/loading)
    (function () {
      var bar = document.getElementById("boot-bar");
      var status = document.getElementById("status");
      if (!bar || !status) return;
      var obs = new MutationObserver(function () {
        var t = (status.textContent || "").toLowerCase();
        if (!t.includes("initializ") && !t.includes("loading")) {
          bar.classList.add("proxy-shell-bar--hide");
          obs.disconnect();
        }
      });
      obs.observe(status, { childList: true, characterData: true, subtree: true });
    })();
  </script>
</body>
</html>
