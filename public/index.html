<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="void-update-url" content=""/>
  <title>Void</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b7aff'/%3E%3Cstop offset='50%25' stop-color='%23a78bfa'/%3E%3Cstop offset='100%25' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M32 4L8 52h12L32 24l12 28h12L32 4z'/%3E%3C/svg%3E" type="image/svg+xml"/>
  <style>
    :root {
      --bg: #000;
      --surface: rgba(255,255,255,.05);
      --border: rgba(255,255,255,.22);
      --text: #fff;
      --muted: rgba(255,255,255,.68);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; width: 100%; background: #000; color: var(--text); font-family: system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 18%),
                  radial-gradient(circle at 80% 30%, rgba(255,255,255,.05), transparent 14%),
                  linear-gradient(135deg, rgba(255,255,255,.02), transparent 46%, rgba(255,255,255,.03));
      opacity: .65;
      animation: float 14s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes float { from { transform: translateY(-10px); } to { transform: translateY(10px); } }
    .page { position: relative; width: min(640px, calc(100% - 2rem)); padding: 2rem; border: 1px solid var(--border); border-radius: 28px; background: rgba(0,0,0,.72); box-shadow: 0 0 0 1px rgba(255,255,255,.08); backdrop-filter: blur(18px); }
    .title { font-size: clamp(2.4rem, 7vw, 4rem); letter-spacing: -.06em; text-transform: uppercase; margin-bottom: .8rem; }
    .subtitle { color: var(--muted); text-transform: uppercase; letter-spacing: .24em; font-size: .78rem; margin-bottom: 2rem; }
    .input-row { display: flex; gap: .75rem; align-items: center; margin-bottom: 1.4rem; }
    .input-row input { flex: 1; min-width: 0; padding: 1rem 1.1rem; border: 1px solid var(--border); border-radius: 18px; background: rgba(255,255,255,.04); color: var(--text); font-size: 1rem; outline: none; }
    .input-row input::placeholder { color: rgba(255,255,255,.45); }
    .go-btn { padding: 1rem 1.6rem; border: 1px solid var(--border); border-radius: 18px; background: transparent; color: #fff; font-weight: 700; cursor: pointer; transition: transform .2s, background .2s; }
    .go-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.08); }
    .mode-label { color: var(--muted); font-size: .92rem; margin-bottom: 1.5rem; }
    .mode-label span { color: #fff; font-weight: 700; }
    .hint-row { display: flex; gap: .5rem; align-items: center; color: var(--muted); font-size: .84rem; }
    kbd { display: inline-flex; align-items: center; justify-content: center; padding: .35rem .7rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,.05); color: #fff; font-size: .78rem; }
    .footer { margin-top: 2rem; color: var(--muted); font-size: .8rem; letter-spacing: .2em; text-align: center; }
    .settings { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.9); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    .settings.open { opacity: 1; pointer-events: auto; }
    .settings-panel { width: min(520px, calc(100% - 2rem)); padding: 2rem; border: 1px solid var(--border); border-radius: 26px; background: rgba(0,0,0,.92); }
    .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .settings-header h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .18em; color: var(--text); }
    .settings-close { width: 2.8rem; height: 2.8rem; border-radius: 14px; border: 1px solid var(--border); background: transparent; color: #fff; cursor: pointer; font-size: 1.15rem; }
    .mode-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .mode-btn { padding: 1rem; border: 1px solid var(--border); border-radius: 18px; background: transparent; color: #fff; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; transition: transform .2s, background .2s; }
    .mode-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.06); }
    .mode-btn.active { background: rgba(255,255,255,.1); border-color: #fff; }
    @media (max-width: 600px) { .page { padding: 1.3rem; border-radius: 20px; } .input-row { flex-direction: column; } .go-btn { width: 100%; } .mode-btns { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="page">
  <div class="title">void</div>
  <div class="subtitle">Minimal proxy launcher</div>
  <form id="f">
    <div class="input-row">
      <input id="url" type="text" placeholder="Enter URL or search term" autocomplete="off" spellcheck="false" autofocus />
      <button type="submit" class="go-btn">Go</button>
    </div>
    <div class="mode-label">Mode: <span id="mode-value">Cloudflare</span></div>
  </form>
  <div class="hint-row">Press <kbd>Q</kbd> for settings</div>
  <div class="footer">UV · SJ · Cloudflare</div>
</div>

<div id="settings" class="settings" aria-hidden="true">
  <div class="settings-panel">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="settings-close" class="settings-close" type="button" aria-label="Close settings">×</button>
    </div>
    <div class="mode-btns" id="mode-btns">
      <button type="button" class="mode-btn active" data-m="cloudflare">Cloudflare</button>
      <button type="button" class="mode-btn" data-m="uv">UV</button>
      <button type="button" class="mode-btn" data-m="sj">SJ</button>
    </div>
  </div>
</div>

<script>
(function(){
  var form = document.getElementById('f');
  var urlInput = document.getElementById('url');
  var settings = document.getElementById('settings');
  var settingsClose = document.getElementById('settings-close');
  var modeValue = document.getElementById('mode-value');
  var currentMode = 'cloudflare';

  function openSettings() {
    settings.classList.add('open');
    settings.setAttribute('aria-hidden', 'false');
  }

  function closeSettings() {
    settings.classList.remove('open');
    settings.setAttribute('aria-hidden', 'true');
  }

  document.addEventListener('keydown', function(e) {
    if (e.key.toLowerCase() === 'q' && !e.repeat) {
      e.preventDefault();
      if (settings.classList.contains('open')) closeSettings();
      else openSettings();
    }
    if (e.key === 'Escape') {
      closeSettings();
    }
  });

  settingsClose.addEventListener('click', closeSettings);
  settings.addEventListener('click', function(e) {
    if (e.target === settings) closeSettings();
  });

  document.querySelectorAll('.mode-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentMode = btn.dataset.m;
      modeValue.textContent = btn.textContent.trim();
      closeSettings();
    });
  });

  function buildUrl(raw) {
    var value = String(raw || '').trim();
    if (!value) return null;
    if (/^https?:\/\//i.test(value)) return value;
    if (value.includes('.') && !value.includes(' ')) return 'https://' + value;
    return 'https://duckduckgo.com/?q=' + encodeURIComponent(value);
  }

  function buildGoUrl(raw) {
    var target = buildUrl(raw);
    if (!target) return null;
    if (currentMode === 'uv') return '/uv.html?url=' + encodeURIComponent(target);
    if (currentMode === 'sj') return '/scramjet.html?url=' + encodeURIComponent(target);
    return '/go?url=' + encodeURIComponent(target) + '&mode=server';
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var goUrl = buildGoUrl(urlInput.value);
    if (!goUrl) return;
    location.assign(goUrl);
  });
})();
</script>
</body>
</html>
