<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Void - Plain Text Proxy Inspector</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: monospace, Courier, monospace;
      margin: 20px;
      background: #000;
      color: #00ff66;
      line-height: 1.4;
    }
    h1, h2 {
      font-size: 1.1rem;
      border-bottom: 1px solid #00ff66;
      padding-bottom: 4px;
      margin-top: 15px;
    }
    .box {
      border: 1px solid #00ff66;
      padding: 12px;
      margin-bottom: 15px;
      background: #080808;
    }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input[type="text"] {
      width: 100%;
      max-width: 650px;
      padding: 8px;
      margin-top: 4px;
      background: #111;
      color: #00ff66;
      border: 1px solid #00ff66;
      font-family: monospace;
      outline: none;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #00ff66;
      color: #000;
      border: none;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #00cc52; }
    pre {
      background: #050505;
      border: 1px solid #00ff66;
      padding: 12px;
      font-size: 0.8rem;
      max-height: 420px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #33ff88;
    }
    .status-ok { color: #00ff66; }
    .status-err { color: #ff3366; }
  </style>
</head>
<body>

  <h1>VOID - PLAIN TEXT PROXY &amp; SERVICE WORKER CHECKER</h1>

  <div class="box">
    <div><strong>VERSION:</strong> v4.0.6</div>
    <div><strong>SERVICE WORKER CONNECTION:</strong> <span id="sw-status">Checking...</span></div>
    <div><strong>USER ID:</strong> <span id="user-id">...</span></div>
    <div><strong>HOST ORIGIN:</strong> <span id="host-origin">...</span></div>
  </div>

  <form id="fetch-form">
    <h2>FETCH &amp; INSPECT WEBSITE OUTPUT (NO NAVIGATION)</h2>
    <label for="target-url">Target Website URL or Query:</label>
    <input type="text" id="target-url" placeholder="https://example.com" required autocomplete="off"/>
    <br/>
    <button type="submit">FETCH WEBSITE OUTPUT</button>
  </form>

  <h2>RETURNED OUTPUT</h2>
  <pre id="output-box">No output fetched yet. Enter a website URL above and click Fetch.</pre>

  <script>
    (function() {
      var swStatus = document.getElementById('sw-status');
      var userIdEl = document.getElementById('user-id');
      var hostOrigin = document.getElementById('host-origin');
      var form = document.getElementById('fetch-form');
      var urlInput = document.getElementById('target-url');
      var outputBox = document.getElementById('output-box');

      hostOrigin.textContent = window.location.origin;

      /* User ID Generator */
      function getUID() {
        var id = localStorage.getItem('void_uid');
        if (!id) {
          id = 'UID-' + Math.random().toString(36).substr(2, 9).toUpperCase();
          localStorage.setItem('void_uid', id);
        }
        return id;
      }
      userIdEl.textContent = getUID();

      /* Service Worker Check */
      if ('serviceWorker' in navigator) {
        swStatus.textContent = 'SUPPORTED & CONNECTED';
        swStatus.className = 'status-ok';
        navigator.serviceWorker.register('/scramjet/scramjet.worker.js', { scope: '/scramjet/service/' })
          .then(function(reg) {
            swStatus.textContent = 'CONNECTED (Scope: ' + reg.scope + ')';
          })
          .catch(function(err) {
            swStatus.textContent = 'SUPPORTED (Registration: ' + err.message + ')';
          });
      } else {
        swStatus.textContent = 'NOT SUPPORTED';
        swStatus.className = 'status-err';
      }

      function logOutput(msg) {
        outputBox.textContent = msg;
      }

      function getOriginBase() {
        if (typeof window !== 'undefined' && window.location && /^https?:$/i.test(window.location.protocol)) {
          return window.location.origin;
        }
        return 'https://math-quiz-alpha-gilt.vercel.app';
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var rawUrl = urlInput.value.trim();
        if (!rawUrl) return;

        var targetUrl = rawUrl;
        if (!/^https?:\/\//i.test(targetUrl)) {
          if (targetUrl.includes('.') && !targetUrl.includes(' ')) {
            targetUrl = 'https://' + targetUrl;
          } else {
            targetUrl = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(targetUrl);
          }
        }

        logOutput('[FETCHING OUTPUT FROM]: ' + targetUrl + '\nPlease wait...\n');

        var base = getOriginBase();
        var endpoint = base + '/api/raw?url=' + encodeURIComponent(targetUrl);
        fetch(endpoint)
          .then(function(res) {
            return res.text().then(function(text) {
              return { status: res.status, ok: res.ok, text: text };
            });
          })
          .then(function(data) {
            var headerStr = '=== HTTP STATUS: ' + data.status + ' ===\n';
            headerStr += '=== TARGET: ' + targetUrl + ' ===\n\n';
            logOutput(headerStr + (data.text || '[Empty Response Body]'));
          })
          .catch(function(err) {
            logOutput('[ERROR FETCHING OUTPUT]: ' + err.message + '\nMake sure the proxy server is running.');
          });
      });
    })();
  </script>
</body>
</html>
