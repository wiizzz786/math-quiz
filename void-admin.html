<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Network Latency Tester</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@300;400&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1115;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      width: 100%;
      padding: 1.5rem;
      background: #15181e;
      border-bottom: 1px solid #1e222a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #94a3b8;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      padding: 2rem;
      flex: 1;
    }

    .input-group {
      width: 100%;
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      flex: 1;
      background: #1e222a;
      border: 1px solid #2d3340;
      padding: 1.2rem 1.5rem;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 1.1rem;
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0 2.5rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 6rem;
      font-weight: 300;
      color: #f8fafc;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      display: flex;
      align-items: baseline;
      transition: color 0.3s;
    }

    .timer-ms {
      font-size: 2.5rem;
      color: #64748b;
    }

    .preview-container {
      width: 100%;
      flex: 1;
      border: 1px solid #2d3340;
      border-radius: 8px;
      background: #000;
      overflow: hidden;
      display: none;
      position: relative;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    
    .status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #64748b;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Network Latency Tester</h1>
  </div>

  <div class="container">
    <div class="input-group">
      <input type="text" id="target-url" placeholder="Enter target domain (e.g. bing.com)" autocomplete="off" spellcheck="false"/>
      <button id="btn-load">Load & Time</button>
    </div>

    <div class="timer-display" id="timer">0.00<span class="timer-ms">s</span></div>

    <div class="preview-container" id="preview-box">
      <div class="status" id="preview-status">Awaiting request...</div>
      <iframe id="proxy-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads"></iframe>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('target-url');
    const loadBtn = document.getElementById('btn-load');
    const timerEl = document.getElementById('timer');
    const previewBox = document.getElementById('preview-box');
    const previewStatus = document.getElementById('preview-status');
    const iframe = document.getElementById('proxy-frame');

    let startTime = 0;
    let timerInterval = null;

    function enc(u) {
      if (!/^https?:\/\//i.test(u)) {
        u = 'https://' + u;
      }
      var salt = Math.random().toString(36).substring(2,6).padEnd(4,'x');
      u = salt + '||' + u;
      var key = 'Void2026';
      var chars = [];
      for(var i=0; i<u.length; i++){
        var code = u.charCodeAt(i) ^ key.charCodeAt(i % key.length);
        chars.push(String.fromCharCode(code));
      }
      return window.location.origin + '/p/' + btoa(chars.join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'') + '.www.securly.com';
    }

    function formatTime(ms) {
      const seconds = Math.floor(ms / 1000);
      const frac = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
      return `${seconds}.${frac}<span class="timer-ms">s</span>`;
    }

    loadBtn.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (!url) return;

      clearInterval(timerInterval);
      previewBox.style.display = 'block';
      iframe.style.display = 'none';
      previewStatus.style.display = 'block';
      previewStatus.textContent = 'Connecting to edge network...';
      timerEl.innerHTML = `0.00<span class="timer-ms">s</span>`;
      timerEl.style.color = '#f8fafc';

      startTime = Date.now();
      timerInterval = setInterval(() => {
        timerEl.innerHTML = formatTime(Date.now() - startTime);
      }, 10);

      iframe.src = enc(url);
    });
    
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadBtn.click();
    });

    iframe.addEventListener('load', () => {
      if (!iframe.src || iframe.src === 'about:blank') return;
      
      clearInterval(timerInterval);
      timerEl.innerHTML = formatTime(Date.now() - startTime);
      timerEl.style.color = '#34d399';
      
      previewStatus.style.display = 'none';
      iframe.style.display = 'block';
    });

    // Auto-Updater (Local File Support)
    const ADMIN_VER = '4.5.5';
    async function checkUpdate() {
      try {
        const origin = window.location.protocol === 'file:' ? 'https://noodalmath.onthewifi.com' : window.location.origin;
        const res = await fetch(origin + '/api/version?t=' + Date.now());
        const data = await res.json();
        if (data && data.version && data.version !== ADMIN_VER) {
          const htmlRes = await fetch(origin + '/void-admin.html?t=' + Date.now());
          const html = await htmlRes.text();
          const blob = new Blob([html], {type: 'text/html'});
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'void-admin.html';
          if (confirm(`New update found (v${data.version}). Click OK to download the newest version!`)) {
            a.click();
          }
        }
      } catch (e) {
        console.error('Update check failed', e);
      }
    }
    setTimeout(checkUpdate, 1000);
  </script>
</body>
</html>
